[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = ["Dockerfile", "backend/**", "frontend/**", "package*.json"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1

[environments.production.deploy]
numReplicas = 1
